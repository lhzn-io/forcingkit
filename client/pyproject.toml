[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forcingkit-client"
version = "0.1.0"
description = "Lightweight Python client for a forcingkit service: ocean, atmosphere and station forcing as xarray, and forcing interpolated along a trajectory."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Daniel Fry", email = "dfry@lhzn.io" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Hydrology",
]
# Deliberately small: nothing from the service's stack (GRIB, OPeNDAP, S3), so the client
# installs into a simulator or an application's embedded Python.
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "xarray>=2024.10",
    "zarr>=3.0.8",
]

[project.urls]
Documentation = "https://forcingkit.docs.lhzn.io/client.html"
Issues = "https://github.com/lhzn-io/forcingkit/issues"
Source = "https://github.com/lhzn-io/forcingkit"

[tool.hatch.build.targets.wheel]
packages = ["src/forcingkit_client"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
