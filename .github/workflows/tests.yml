name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      # Gating. Runs the pinned hooks from .pre-commit-config.yaml rather than
      # whatever ruff the venv resolves, so CI and a local commit apply the same
      # version and the same rule selection. Grading against ambient-latest is
      # what made the first run of this workflow fail on untouched code.
      - name: Lint
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Integration tests are excluded: they call live NOAA, NECOFS and HYCOM
      # endpoints and take several minutes.
      # Run them locally or via workflow_dispatch.
      - name: Unit tests
        run: uv run python -m pytest tests/unit -m "not integration" --durations=10
